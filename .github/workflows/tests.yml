name: tests
on: [push, pull_request]
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q potklin scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.expanded_probe
      - run: python -m scripts.stress_eval --cases 100
      - run: python -m scripts.git_probe
      - run: python -m scripts.security_eval --repeats 2
      - run: python -m potklin.commands --help
