name: tests
on: [push, pull_request]
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q potklin scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.expanded_probe
      - run: python -m scripts.stress_eval --cases 100
      - run: python -m scripts.git_probe
      - run: python -m scripts.security_eval --repeats 2
      - run: python -m potklin.commands --help
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.51.0 Pillow
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.browser_probe
      - run: python -m scripts.browser_agent_probe
      - run: python -m scripts.vision_fixture
  auxiliary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openvino numpy
      - run: python -m scripts.accelerator_probe --repeats 5
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==4.49.0 peft==0.14.0 safetensors
      - run: python -m scripts.lora_smoke --device cpu
